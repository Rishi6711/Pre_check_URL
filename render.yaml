services:
  - type: web
    name: precheck-url-engine
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
